name: drift

on:
  workflow_dispatch:
  schedule:
    # Weekly: libphonenumber releases roughly fortnightly and is the fastest-moving pin.
    - cron: "0 6 * * 1"

concurrency:
  group: upstream-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: report
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Compare pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/upstream_watch.py --pins data/upstream-pins.json

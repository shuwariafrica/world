name: drift

on:
  workflow_dispatch:
  schedule:
    # Weekly: libphonenumber releases roughly fortnightly and is the fastest-moving pin.
    - cron: "0 6 * * 1"

concurrency:
  group: upstream-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: report
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compare pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/upstream_watch.py --pins data/upstream-pins.json
